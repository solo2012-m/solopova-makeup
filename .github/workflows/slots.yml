
name: Sync free slots

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch slots
        run: python3 scripts/fetch_slots.py
      - name: Commit if changed
        run: |
          git config user.name "slots-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/slots.json
          git diff --cached --quiet || git commit -m "Slots sync [skip ci]"
          git push
