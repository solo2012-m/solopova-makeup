<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontakt — Solopova Makeup</title>
<meta name="description" content="Kontakt: Maribor, Slovenija.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site"><div class="wrap nav">
  <a class="brand" href="index.html"><b>Solopova Makeup</b><span data-i18n="brand_tag">Ličenje · trepalnice · obrvi · lasje</span></a>
  <a class="link" href="index.html" data-i18n="nav_home">Domov</a>
  <a class="link" href="storitve.html" data-i18n="nav_services">Storitve</a>
  <a class="link" href="galerija.html" data-i18n="nav_gallery">Galerija</a>
  <a class="link" href="tecaj.html" data-i18n="nav_course">Tečaj</a>
  <a class="link active" href="kontakt.html" data-i18n="nav_contact">Kontakt</a>
  <div class="lang"><button data-lang="sl">SL</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
</div></header>
<main>
<section class="wrap">
  <div class="section-head reveal"><h2 data-i18n="contact_title">Kontakt</h2><p data-i18n="contact_sub"></p></div>
  <div class="grid g2">
    <div class="reveal">
      <p><b data-i18n="contact_addr"></b></p>
      <p>Instagram: <a class="link" href="#">@solopova_makeup</a></p>
      <p>WhatsApp / Tel: <a class="link" href="#">+386 …</a></p>
      <p>E-mail: <a class="link" href="#">info@solopovamakeup.si</a></p>
      <div class="ph wide" style="margin-top:1rem">zemljevid — Maribor</div>
    </div>
    <form class="contact reveal" onsubmit="return false">
      <input type="text" data-i18n-ph="form_name" placeholder="Ime">
      <input type="email" data-i18n-ph="form_email" placeholder="E-pošta">
      <textarea rows="5" data-i18n-ph="form_msg" placeholder="Sporočilo"></textarea>
      <button class="btn" type="submit" data-i18n="form_send">Pošlji</button>
    </form>
  </div>
</section>
</main>
<footer class="site"><div class="wrap foot">
  <div data-i18n="foot_note">© 2026 Solopova Makeup · Maribor</div>
  <div><a class="link" href="#">Instagram</a> · <a class="link" href="#">WhatsApp</a></div>
</div></footer>
<script src="assets/i18n.js"></script>
</body>
</html>
