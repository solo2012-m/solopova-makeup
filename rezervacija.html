    if(L) ul.appendChild(mRow(t.loc, (L[curLang()]||L.sl)+(L.mobile ? " — "+addr : ", "+L.addr)));
    sel.forEach(function(sv){ var li=document.createElement("li"); li.textContent="\u2022 "+sv[curLang()]+" ("+priceText(sv)+")"; ul.appendChild(li); });
    if(d) ul.appendChild(mRow(t.dt,d));
    if(tm) ul.appendChild(mRow(t.tm,tm));
    if(nm) ul.appendChild(mRow(t.nm,nm));
  }
  document.getElementById("bm-note").textContent = ok ? (t.book_ok_note || f.n) : "";
  var wa=document.getElementById("bm-wa");
  if(ok){ wa.style.display="none"; }
  else {
    wa.style.display="inline-block";
    wa.textContent = t.book_wa_btn || f.w;
    wa.setAttribute("href","https://wa.me/"+WA+"?text="+encodeURIComponent(msg||""));
  }
  document.getElementById("bm-close").textContent = t.book_ok_close || f.c;
  m.hidden=false;
  document.body.style.overflow="hidden";
}
function send(){
  var msg=buildMessage(); if(!msg) return;
  var b=document.getElementById("bsend"); if(!b) return;
  var old=b.textContent; b.disabled=true; b.textContent="\u2026";

    showSent(ok ? "" : "Ni potrditve \u2013 pi\u0161i na WhatsApp");

  });
}
function sendMail(){
  var msg=buildMessage(); if(!msg) return;

}
var CALAPI="https://solopova-slots.solopoff-mikhail.workers.dev/cal-slots";
var LIVE={}, LIVE_PENDING={};
function hmLocal(iso){ try { return new Date(iso).toLocaleTimeString("sl-SI",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Europe/Ljubljana"}); } catch(e){ return ""; } }
var LIVE={}, LIVE_PENDING={};
function calTimes(d, dur){
  var key=d+"|"+dur;
  if(LIVE[key]!==undefined) return LIVE[key];
  if(!LIVE_PENDING[key]){
    LIVE_PENDING[key]=1;
    fetch(CALAPI+"?date="+encodeURIComponent(d)+"&dur="+encodeURIComponent(dur))
      .then(function(r){ return r.json(); })
      .then(function(j){ LIVE[key]=(j&&j.ok&&j.slots)?j.slots:null; delete LIVE_PENDING[key]; refreshTimes(); })
      .catch(function(){ LIVE[key]=null; delete LIVE_PENDING[key]; refreshTimes(); });
  }
  return undefined;
}
function bindingService(){ var sel=selected(); if(!sel.length) return null; var best=sel[0]; sel.forEach(function(s){ if((s.dur||0)>(best.dur||0)) best=s; }); return best; }
function ljNow(){
  try{
    var parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Ljubljana",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
    var o={}; parts.forEach(function(p){ if(p.type!=="literal") o[p.type]=p.value; });
    return { date: o.year+"-"+o.month+"-"+o.day, minutes: (parseInt(o.hour,10)%24)*60+parseInt(o.minute,10) };
  }catch(e){
    var d=new Date();
    return { date: d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2), minutes: d.getHours()*60+d.getMinutes() };
  }
}
function hmToMin(x){ var p=x.split(":"); return parseInt(p[0],10)*60+parseInt(p[1],10); }
function fmtDate(v){
  if(!v) return "";
  var p=v.split("-"); if(p.length!==3) return v;
  var l=curLang();
  if(l==="en") return p[2]+"/"+p[1]+"/"+p[0];
  if(l==="ru") return p[2]+"."+p[1]+"."+p[0];
  return p[2]+". "+p[1]+". "+p[0];
}
function syncDateView(){
  var d=document.getElementById("bdate"), v=document.getElementById("bdateView");
  if(!d||!v) return;
  v.value=fmtDate(d.value);
}
function refreshTimes(){
  var tm=document.getElementById("btime"); if(!tm) return;
  var d=document.getElementById("bdate").value, s=bindingService(), l=curLang();
  var prev=tm.value; tm.innerHTML="";
  var agree=(l==="ru"?"По договорённости":(l==="en"?"By arrangement":"Po dogovoru"));
  function addAgree(){ tm.appendChild(new Option(agree, agree)); }
  if(!d){ tm.appendChild(new Option("—", "")); return; }
  if(!s){
    for(var h=9; h<=18; h++){ ["00","30"].forEach(function(m){ var hh=(h<10?"0"+h:""+h); tm.appendChild(new Option(hh+":"+m, hh+":"+m)); }); }
    addAgree(); if(prev) tm.value=prev; return;
  }
  var dur=s.dur||60;
  var slots=calTimes(d,dur);
  var now=ljNow();
  if(slots && slots.length && d===now.date){
    var limit=now.minutes+60;
    slots=slots.filter(function(x){ return hmToMin(x)>=limit; });
  }
  var noFree=(l==="ru"?"Нет свободного времени":(l==="en"?"No free slots":"Ni prostih terminov"));
  if(slots===undefined){ tm.appendChild(new Option("…","")); addAgree(); return; }
  if(slots && slots.length){
    slots.forEach(function(x){ tm.appendChild(new Option(x,x)); });
    addAgree(); if(prev && slots.indexOf(prev)>=0) tm.value=prev; return;
  }
  tm.appendChild(new Option(noFree, "")); addAgree();
}
document.addEventListener("DOMContentLoaded", function(){
  var tm=document.getElementById("btime"); ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"].forEach(function(o){ var e=document.createElement("option"); e.value=o; e.textContent=o; tm.appendChild(e); });
  document.getElementById("bdate").min=ljNow().date;
  syncDateView();
  renderLocs();
  syncAddr();
  renderServices();
  refreshTimes();
  document.getElementById("bdate").addEventListener("change", function(){ syncDateView(); refreshTimes(); });
  Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function(b){ b.addEventListener("click", function(){ setTimeout(syncDateView, 0); }); });
  document.getElementById("bloc").addEventListener("change", function(){ syncAddr(); renderServices(); refreshTimes(); });
  document.getElementById("bsend").addEventListener("click", send);
  var mc=document.getElementById("bm-close"); if(mc) mc.addEventListener("click", closeModal);
  var mod=document.getElementById("bmodal");
  if(mod){
    mod.addEventListener("click", function(e){ if(e.target===mod) closeModal(); });
    document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeModal(); });
  }
  var bm=document.getElementById("bmail"); if(bm) bm.addEventListener("click", sendMail);
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setTimeout(function(){ renderLocs(); renderServices(); refreshTimes(); },0); }); });
});
</script>
