<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">

<body>
<header class="site"><div class="wrap nav">

  <a class="link" href="index.html" data-i18n="nav_home"></a>

<main>
<section class="wrap">
  <div class="section-head reveal"><h2 data-i18n="book_title"></h2><p data-i18n="book_sub"></p></div>
  
  <form class="booking" id="booking" onsubmit="return false">
    <div class="bstep reveal">
      <label class="blabel" data-i18n="book_step1"></label>
      <p class="bsub" data-i18n="book_pick"></p>
      <div class="bservices" id="bservices"></div>
      <div class="btotal" id="btotal"></div>
    </div>
    <div class="bstep reveal">
      <label class="blabel" data-i18n="book_step2"></label>
      <div class="brow">
        <input type="date" id="bdate">
        <select id="btime"></select>
      </div>
    </div>
    <div class="bstep reveal">
      <label class="blabel" data-i18n="book_step3"></label>
      <input type="text" id="bname" data-i18n-ph="book_name" placeholder="Ime">
      <input type="tel" id="bphone" placeholder="+386 ...">
      <textarea id="bnote" rows="3" data-i18n-ph="book_note" placeholder="Opomba"></textarea>
    </div>
    <button class="btn" id="bsend" type="submit" data-i18n="book_send"></button>
    <p class="bhint" data-i18n="book_hint"></p>
    <button class="btn ghost" id="bcal" type="button" data-i18n="book_cal_btn"></button>
    <p class="bhint" data-i18n="book_cal_note"></p>
  </form>
  <h3 class="whead reveal" data-i18n="book_cal_title"></h3>
  <div id="cal-inline" class="calbox reveal"></div>
  <p class="bhint2" data-i18n="book_hint_cal"></p>
  
  <p class="bhint2" data-i18n="book_hint_cal"></p>

</main>
<footer class="site"><div class="wrap foot">
  <div data-i18n="foot_note"></div>
  <div><a class="link" href="https://www.instagram.com/solopova.makeup/" target="_blank" rel="noopener">Instagram</a> · <a class="link" href="https://wa.me/38669900769" target="_blank" rel="noopener">WhatsApp</a></div>
</div></footer>
<script src="assets/i18n.js"></script>
<script>
var SERVICES = [
 {id:"porocno",dur:120,slug:"porocno-licenje", sl:"Poročno ličenje", en:"Bridal makeup", ru:"Свадебный макияж", price:"90 €", img:"assets/img/porocno-booking.jpg"},
 {id:"poskusno",dur:60,slug:"poskusno-licenje", sl:"Poskusno ličenje", en:"Trial makeup", ru:"Пробный макияж", price:"40 €", img:"assets/img/poskusno-booking.jpg"},
 {id:"dnevno",dur:60,slug:"dnevno-licenje", sl:"Dnevno ličenje", en:"Daytime makeup", ru:"Дневной макияж", price:"45 €", img:"assets/img/dnevno-booking.jpg"},
 {id:"vecerno",dur:60,slug:"vecerno-licenje", sl:"Večerno ličenje", en:"Evening makeup", ru:"Вечерний макияж", price:"50 €", img:"assets/img/vecerno-booking.jpg"},
 {id:"lifting",dur:60,slug:"lifting-licenje", sl:"Lifting ličenje", en:"Lifting makeup", ru:"Лифтинг-макияж", price:"50 €", img:"assets/img/lifting-booking.jpg"},
 {id:"art",dur:60,slug:"kreativno-licenje", sl:"Kreativno / art ličenje", en:"Creative / art makeup", ru:"Креативный / арт-макияж", price:"od 50 €", img:"assets/img/art-booking2.jpg"},
 {id:"lash",dur:60,slug:"laminacija-trepalnic", sl:"Laminacija trepalnic", en:"Lash lamination", ru:"Ламинирование ресниц", price:"48 €", img:"assets/img/trepalnice-booking.jpg"},
 {id:"browlam",dur:60,slug:"laminacija-obrvi", sl:"Laminacija obrvi", en:"Brow lamination", ru:"Ламинирование бровей", price:"30 €", img:"assets/img/obrvi-lam2.jpg"},
 {id:"browall",dur:90,slug:"obrvi-paket", sl:"Laminacija + barvanje + korekcija obrvi", en:"Brow: lamination + tinting + shaping", ru:"Брови: ламинирование + окрашивание + коррекция", price:"55 €", img:"assets/img/obrvi-booking2.jpg"},
 {id:"browbar",dur:30,slug:"barvanje-obrvi", sl:"Barvanje obrvi", en:"Brow tinting", ru:"Окрашивание бровей", price:"15 €", img:"assets/img/obrvi-booking3.jpg"},
 {id:"browkor",dur:30,slug:"korekcija-obrvi", sl:"Korekcija obrvi", en:"Brow shaping", ru:"Коррекция бровей", price:"10 €", img:"assets/img/obrvi-kor3.jpg"},
 {id:"stajling",dur:60,slug:"stajling-las", sl:"Stajling las za posebne priložnosti", en:"Hairstyling for special occasions", ru:"Причёска для особых случаев", price:"od 45 €", img:"assets/img/frizure-booking.jpg"},
 {id:"podaljsevanje",dur:180,slug:"podaljsevanje-las", sl:"Podaljševanje las (novo)", en:"Hair extensions (new)", ru:"Наращивание волос (новинка)", price:"od 150 € + kapsule", img:"assets/img/podaljsevanje-1.jpg"}
];
var WA="38669900769";
function curLang(){ var l=document.documentElement.lang||"sl"; return ["sl","en","ru"].indexOf(l)>=0?l:"sl"; }
function T(){ return {
  sl:{hi:"Pozdravljeni! Želim rezervirati termin.",sv:"Storitve",dt:"Datum",tm:"Ura",nm:"Ime",ph:"Telefon",nt:"Opomba",total:"Skupaj",from:"okvirno od",warn:"Izberite vsaj eno storitev.",needone:"Za koledar izberite natanko eno storitev. Za več storitev pošljite zahtevo."},
  en:{hi:"Hello! I would like to book an appointment.",sv:"Services",dt:"Date",tm:"Time",nm:"Name",ph:"Phone",nt:"Note",total:"Total",from:"about",warn:"Please choose at least one service.",needone:"To use the calendar, choose exactly one service. For several services, send a request."},
  ru:{hi:"Здравствуйте! Хочу записаться.",sv:"Услуги",dt:"Дата",tm:"Время",nm:"Имя",ph:"Телефон",nt:"Комментарий",total:"Итого",from:"примерно от",warn:"Выберите хотя бы одну услугу.",needone:"Для календаря выберите ровно одну услугу. Для нескольких — отправьте заявку."}
}[curLang()]; }
function priceNum(p){ var m=String(p).replace(/\s/g,"").match(/(\d+)/); return m?parseInt(m[1],10):null; }
function totalInfo(sel){
  var sum=0, from=false;
  sel.forEach(function(s){ var n=priceNum(s.price); if(n===null){ from=true; return; } sum+=n; if(/od|from|от/i.test(s.price)) from=true; });
  return {sum:sum, from:from};
}
function selected(){ return Array.prototype.slice.call(document.querySelectorAll("#bservices input:checked")).map(function(i){ return SERVICES.filter(function(s){return s.id===i.value;})[0]; }).filter(Boolean); }
function renderServices(){
  var l=curLang(), box=document.getElementById("bservices");
  var checked={}; Array.prototype.forEach.call(box.querySelectorAll("input:checked"), function(i){ checked[i.value]=1; });
  box.innerHTML="";
  SERVICES.forEach(function(s){
    var lab=document.createElement("label"); lab.className="bcard";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.value=s.id; cb.checked=!!checked[s.id];
    var img=document.createElement("img"); img.className="bthumb"; img.src=s.img; img.alt=""; img.loading="lazy";
    var t=document.createElement("span"); t.className="bcard-t"; t.textContent=s[l];
    var p=document.createElement("span"); p.className="bcard-p"; p.textContent=s.price;
    lab.appendChild(cb); lab.appendChild(img); lab.appendChild(t); lab.appendChild(p);
    cb.addEventListener("change", function(){ update(); refreshTimes(); });
    box.appendChild(lab);
  });
  update();
}
function update(){
  var sel=selected(), el=document.getElementById("btotal");
  Array.prototype.forEach.call(document.querySelectorAll("#bservices .bcard"), function(c){
    c.classList.toggle("on", !!c.querySelector("input").checked);
  });
  if(!sel.length){ el.classList.remove("on"); el.textContent=""; return; }
  var ti=totalInfo(sel), t=T();
  el.classList.add("on");
  el.textContent = t.total+": " + (ti.from ? t.from+" " : "") + ti.sum + " €";
  var bc=document.getElementById("bcal"); if(bc){ bc.disabled = (sel.length!==1); bc.style.opacity = (sel.length===1? "1":"0.5"); }
}
function send(){
  var sel=selected(), t=T(), l=curLang();
  if(!sel.length){ alert(t.warn); return; }
  var name=document.getElementById("bname").value.trim();
  var phone=document.getElementById("bphone").value.trim();
  var note=document.getElementById("bnote").value.trim();
  var d=document.getElementById("bdate").value, tm=document.getElementById("btime").value;
  var ti=totalInfo(sel);
  var msg=t.hi+"\n"+t.sv+":";
  sel.forEach(function(s){ msg+="\n• "+s[l]+" ("+s.price+")"; });
  msg+="\n"+t.total+": "+(ti.from? t.from+" ":"")+ti.sum+" €";
  if(d) msg+="\n"+t.dt+": "+d;
  if(tm) msg+="\n"+t.tm+": "+tm;
  if(name) msg+="\n"+t.nm+": "+name;
  if(phone) msg+="\n"+t.ph+": "+phone;
  if(note) msg+="\n"+t.nt+": "+note;
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
}
var SLOTS=null, SLOT_URL="assets/slots.json";
function winFor(slug){ return (slug==="porocno-licenje")?["05:00","18:00"]:["09:00","18:00"]; }
function bindingService(){ var sel=selected(); if(!sel.length) return null; var best=sel[0]; sel.forEach(function(s){ if((s.dur||0)>(best.dur||0)) best=s; }); return best; }
function refreshTimes(){
  var tm=document.getElementById("btime"); if(!tm) return;
  var d=document.getElementById("bdate").value, s=bindingService(), l=curLang();
  var prev=tm.value; tm.innerHTML="";
  if(!d){ tm.appendChild(new Option((l==="ru"?"— выберите дату —":(l==="en"?"— choose a date —":"— izberite datum —")), "")); return; }
  var win=winFor(s?s.slug:"");
  var list=null;
  if(SLOTS && s && SLOTS.slots && SLOTS.slots[s.slug] && SLOTS.slots[s.slug][d]) list=SLOTS.slots[s.slug][d];
  if(list){
    var times=list.filter(function(x){ return x>=win[0] && x<=win[1]; });
    if(times.length){ times.forEach(function(x){ tm.appendChild(new Option(x,x)); }); if(prev) tm.value=prev; return; }
    tm.appendChild(new Option((l==="ru"?"Нет свободного времени":(l==="en"?"No free slots":"Ni prostih terminov")), "")); return;
  }
  for(var h=parseInt(win[0],10); h<=parseInt(win[1],10); h++){
    ["00","30"].forEach(function(m){ var hh=(h<10?"0"+h:""+h), x=hh+":"+m; if(x>=win[0] && x<=win[1]) tm.appendChild(new Option(x,x)); });
  }
  if(prev) tm.value=prev;
}
function loadSlots(){ fetch(SLOT_URL+"?t="+Date.now()).then(function(r){ return r.json(); }).then(function(j){ SLOTS=j; refreshTimes(); }).catch(function(){ SLOTS=null; refreshTimes(); }); }
function calUrl(){
  var sel=selected(); if(sel.length!==1) return null;
  var s=sel[0]; if(!s.slug) return null;
  var d=document.getElementById("bdate").value;
  var u="https://cal.com/solopova-makeup/"+s.slug+"?lang="+curLang();
  if(d) u+="&date="+d;
  return u;
}
function calClick(){
  var u=calUrl();
  if(!u){ alert(T().needone); return; }
  window.open(u,"_blank");
}
document.addEventListener("DOMContentLoaded", function(){
  var tm=document.getElementById("btime"); ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"].forEach(function(o){ var e=document.createElement("option"); e.value=o; e.textContent=o; tm.appendChild(e); });
  document.getElementById("bdate").min=new Date().toISOString().split("T")[0];
  renderServices();
  refreshTimes();
  loadSlots();
  document.getElementById("bdate").addEventListener("change", refreshTimes);
  document.getElementById("bsend").addEventListener("click", send);
  var bc=document.getElementById("bcal"); if(bc) bc.addEventListener("click", calClick);
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setTimeout(function(){ renderServices(); refreshTimes(); },0); }); });
});
</script>
<script>
(function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); };})(window, "https://app.cal.com/embed/embed.js", "init");
Cal("init", {origin:"https://cal.com"});
function calLang(){ var l=document.documentElement.lang||"sl"; return ["sl","en","ru"].indexOf(l)>=0?l:"sl"; }
Cal("inline", { elementOrSelector: "#cal-inline", calLink: "solopova-makeup?lang="+calLang(), config: { layout: "month_view", theme: "light" } });
</script>
</body>
</html>
