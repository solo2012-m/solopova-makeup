<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezervacija — Solopova Makeup</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site"><div class="wrap nav">
  <a class="brand" href="index.html"><b>Solopova Makeup</b><span data-i18n="brand_tag"></span></a>
  <a class="link" href="index.html" data-i18n="nav_home"></a>
  <a class="link" href="storitve.html" data-i18n="nav_services"></a>
  <a class="link" href="galerija.html" data-i18n="nav_gallery"></a>
  <a class="link" href="tecaj.html" data-i18n="nav_course"></a>
  <a class="link" href="kontakt.html" data-i18n="nav_contact"></a>
  <a class="link active" href="rezervacija.html" data-i18n="nav_book"></a>
  <div class="lang"><button data-lang="sl">SL</button><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
</div></header>
<main>
<section class="wrap">
  <div class="section-head reveal"><h2 data-i18n="book_title"></h2><p data-i18n="book_sub"></p></div>
  <div id="cal-inline" class="calbox reveal"></div>
  <p class="bhint2" data-i18n="book_hint_cal"></p>
  <details class="wa-extra reveal">
    <summary data-i18n="book_more"></summary>
  <form class="booking" id="booking" onsubmit="return false">
    <div class="bstep reveal">
      <label class="blabel" data-i18n="book_step1"></label>
      <p class="bsub" data-i18n="book_pick"></p>
      <div class="bservices" id="bservices"></div>
      <div class="btotal" id="btotal"></div>
    </div>
    <div class="bstep reveal">
      <label class="blabel" data-i18n="book_step2"></label>
      <div class="brow">
        <input type="date" id="bdate">
        <select id="btime"></select>
      </div>
    </div>
    <div class="bstep reveal">
      <label class="blabel" data-i18n="book_step3"></label>
      <input type="text" id="bname" data-i18n-ph="book_name" placeholder="Ime">
      <input type="tel" id="bphone" placeholder="+386 ...">
      <textarea id="bnote" rows="3" data-i18n-ph="book_note" placeholder="Opomba"></textarea>
    </div>
    <button class="btn" id="bsend" type="submit" data-i18n="book_send"></button>
    <p class="bhint" data-i18n="book_hint"></p>
  </form>
  </details>
</section>
</main>
<footer class="site"><div class="wrap foot">
  <div data-i18n="foot_note"></div>
  <div><a class="link" href="https://www.instagram.com/solopova.makeup/" target="_blank" rel="noopener">Instagram</a> · <a class="link" href="https://wa.me/38669900769" target="_blank" rel="noopener">WhatsApp</a></div>
</div></footer>
<script src="assets/i18n.js"></script>
<script>
var SERVICES = [
 {id:"porocno", sl:"Poročno ličenje", en:"Bridal makeup", ru:"Свадебный макияж", price:"90 €", img:"assets/img/porocno-booking.jpg"},
 {id:"poskusno", sl:"Poskusno ličenje", en:"Trial makeup", ru:"Пробный макияж", price:"40 €", img:"assets/img/poskusno-booking.jpg"},
 {id:"dnevno", sl:"Dnevno ličenje", en:"Daytime makeup", ru:"Дневной макияж", price:"45 €", img:"assets/img/dnevno-booking.jpg"},
 {id:"vecerno", sl:"Večerno ličenje", en:"Evening makeup", ru:"Вечерний макияж", price:"50 €", img:"assets/img/vecerno-booking.jpg"},
 {id:"lifting", sl:"Lifting ličenje", en:"Lifting makeup", ru:"Лифтинг-макияж", price:"50 €", img:"assets/img/lifting-booking.jpg"},
 {id:"art", sl:"Kreativno / art ličenje", en:"Creative / art makeup", ru:"Креативный / арт-макияж", price:"od 50 €", img:"assets/img/art-booking2.jpg"},
 {id:"lash", sl:"Laminacija trepalnic", en:"Lash lamination", ru:"Ламинирование ресниц", price:"48 €", img:"assets/img/trepalnice-booking.jpg"},
 {id:"browlam", sl:"Laminacija obrvi", en:"Brow lamination", ru:"Ламинирование бровей", price:"30 €", img:"assets/img/obrvi-lam2.jpg"},
 {id:"browall", sl:"Laminacija + barvanje + korekcija obrvi", en:"Brow: lamination + tinting + shaping", ru:"Брови: ламинирование + окрашивание + коррекция", price:"55 €", img:"assets/img/obrvi-booking2.jpg"},
 {id:"browbar", sl:"Barvanje obrvi", en:"Brow tinting", ru:"Окрашивание бровей", price:"15 €", img:"assets/img/obrvi-booking3.jpg"},
 {id:"browkor", sl:"Korekcija obrvi", en:"Brow shaping", ru:"Коррекция бровей", price:"10 €", img:"assets/img/obrvi-kor3.jpg"},
 {id:"stajling", sl:"Stajling las za posebne priložnosti", en:"Hairstyling for special occasions", ru:"Причёска для особых случаев", price:"od 45 €", img:"assets/img/frizure-booking.jpg"},
 {id:"podaljsevanje", sl:"Podaljševanje las (novo)", en:"Hair extensions (new)", ru:"Наращивание волос (новинка)", price:"od 150 € + kapsule", img:"assets/img/podaljsevanje-1.jpg"}
];
var WA="38669900769";
function curLang(){ var l=document.documentElement.lang||"sl"; return ["sl","en","ru"].indexOf(l)>=0?l:"sl"; }
function T(){ return {
  sl:{hi:"Pozdravljeni! Želim rezervirati termin.",sv:"Storitve",dt:"Datum",tm:"Ura",nm:"Ime",ph:"Telefon",nt:"Opomba",total:"Skupaj",from:"okvirno od",warn:"Izberite vsaj eno storitev."},
  en:{hi:"Hello! I would like to book an appointment.",sv:"Services",dt:"Date",tm:"Time",nm:"Name",ph:"Phone",nt:"Note",total:"Total",from:"about",warn:"Please choose at least one service."},
  ru:{hi:"Здравствуйте! Хочу записаться.",sv:"Услуги",dt:"Дата",tm:"Время",nm:"Имя",ph:"Телефон",nt:"Комментарий",total:"Итого",from:"примерно от",warn:"Выберите хотя бы одну услугу."}
}[curLang()]; }
function priceNum(p){ var m=String(p).replace(/\s/g,"").match(/(\d+)/); return m?parseInt(m[1],10):null; }
function totalInfo(sel){
  var sum=0, from=false;
  sel.forEach(function(s){ var n=priceNum(s.price); if(n===null){ from=true; return; } sum+=n; if(/od|from|от/i.test(s.price)) from=true; });
  return {sum:sum, from:from};
}
function selected(){ return Array.prototype.slice.call(document.querySelectorAll("#bservices input:checked")).map(function(i){ return SERVICES.filter(function(s){return s.id===i.value;})[0]; }).filter(Boolean); }
function renderServices(){
  var l=curLang(), box=document.getElementById("bservices");
  var checked={}; Array.prototype.forEach.call(box.querySelectorAll("input:checked"), function(i){ checked[i.value]=1; });
  box.innerHTML="";
  SERVICES.forEach(function(s){
    var lab=document.createElement("label"); lab.className="bcard";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.value=s.id; cb.checked=!!checked[s.id];
    var img=document.createElement("img"); img.className="bthumb"; img.src=s.img; img.alt=""; img.loading="lazy";
    var t=document.createElement("span"); t.className="bcard-t"; t.textContent=s[l];
    var p=document.createElement("span"); p.className="bcard-p"; p.textContent=s.price;
    lab.appendChild(cb); lab.appendChild(img); lab.appendChild(t); lab.appendChild(p);
    cb.addEventListener("change", update);
    box.appendChild(lab);
  });
  update();
}
function update(){
  var sel=selected(), el=document.getElementById("btotal");
  Array.prototype.forEach.call(document.querySelectorAll("#bservices .bcard"), function(c){
    c.classList.toggle("on", !!c.querySelector("input").checked);
  });
  if(!sel.length){ el.classList.remove("on"); el.textContent=""; return; }
  var ti=totalInfo(sel), t=T();
  el.classList.add("on");
  el.textContent = t.total+": " + (ti.from ? t.from+" " : "") + ti.sum + " €";
}
function send(){
  var sel=selected(), t=T(), l=curLang();
  if(!sel.length){ alert(t.warn); return; }
  var name=document.getElementById("bname").value.trim();
  var phone=document.getElementById("bphone").value.trim();
  var note=document.getElementById("bnote").value.trim();
  var d=document.getElementById("bdate").value, tm=document.getElementById("btime").value;
  var ti=totalInfo(sel);
  var msg=t.hi+"\n"+t.sv+":";
  sel.forEach(function(s){ msg+="\n• "+s[l]+" ("+s.price+")"; });
  msg+="\n"+t.total+": "+(ti.from? t.from+" ":"")+ti.sum+" €";
  if(d) msg+="\n"+t.dt+": "+d;
  if(tm) msg+="\n"+t.tm+": "+tm;
  if(name) msg+="\n"+t.nm+": "+name;
  if(phone) msg+="\n"+t.ph+": "+phone;
  if(note) msg+="\n"+t.nt+": "+note;
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
}
document.addEventListener("DOMContentLoaded", function(){
  var tm=document.getElementById("btime"); ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"].forEach(function(o){ var e=document.createElement("option"); e.value=o; e.textContent=o; tm.appendChild(e); });
  document.getElementById("bdate").min=new Date().toISOString().split("T")[0];
  renderServices();
  document.getElementById("bsend").addEventListener("click", send);
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setTimeout(renderServices,0); }); });
});
</script>
<script>
(function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if (typeof namespace === "string") { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ["initNamespace", namespace]); } else p(cal, ar); return; } p(cal, ar); };})(window, "https://app.cal.com/embed/embed.js", "init");
Cal("init", {origin:"https://cal.com"});
function calLang(){ var l=document.documentElement.lang||"sl"; return ["sl","en","ru"].indexOf(l)>=0?l:"sl"; }
Cal("inline", { elementOrSelector: "#cal-inline", calLink: "solopova-makeup?lang="+calLang(), config: { layout: "month_view", theme: "light" } });
</script>
</body>
</html>
