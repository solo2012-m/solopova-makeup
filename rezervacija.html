 {id:"browall",dur:60,slug:"obrvi-paket", sl:"Laminacija + barvanje + korekcija obrvi", en:"Brow: lamination + tinting + shaping", ru:"Брови: ламинирование + окрашивание + коррекция", price:"55 €", img:"assets/img/obrvi-booking2.jpg"},
 {id:"browbar",dur:30,slug:"barvanje-obrvi", sl:"Barvanje obrvi", en:"Brow tinting", ru:"Окрашивание бровей", price:"15 €", img:"assets/img/obrvi-booking3.jpg"},
 {id:"browkor",dur:30,slug:"korekcija-obrvi", sl:"Korekcija obrvi", en:"Brow shaping", ru:"Коррекция бровей", price:"10 €", img:"assets/img/obrvi-kor3.jpg"},

];
var WA="38669900769";
function curLang(){ var l=document.documentElement.lang||"sl"; return ["sl","en","ru"].indexOf(l)>=0?l:"sl"; }
function T(){ return {
  sl:{hi:"Pozdravljeni! Želim rezervirati termin.",sv:"Storitve",dt:"Datum",tm:"Ura",nm:"Ime",ph:"Telefon",em:"E-mail",nt:"Opomba",total:"Skupaj",from:"okvirno od",fromShort:"od",warn:"Izberite vsaj eno storitev.",needone:"Za koledar izberite natanko eno storitev. Za več storitev pošljite zahtevo."},
  en:{hi:"Hello! I would like to book an appointment.",sv:"Services",dt:"Date",tm:"Time",nm:"Name",ph:"Phone",em:"E-mail",nt:"Note",total:"Total",from:"about",fromShort:"from",warn:"Please choose at least one service.",needone:"To use the calendar, choose exactly one service. For several services, send a request."},
  ru:{hi:"Здравствуйте! Хочу записаться.",sv:"Услуги",dt:"Дата",tm:"Время",nm:"Имя",ph:"Телефон",em:"E-mail",nt:"Комментарий",total:"Итого",from:"примерно от",fromShort:"от",warn:"Выберите хотя бы одну услугу.",needone:"Для календаря выберите ровно одну услугу. Для нескольких — отправьте заявку."}
}[curLang()]; }
function priceText(s){ var l=curLang(); return (s.priceI18n && s.priceI18n[l]) || s.price; }
function priceNum(p){ var m=String(p).replace(/\s/g,"").match(/(\d+)/); return m?parseInt(m[1],10):null; }
function totalInfo(sel){
  var sum=0, from=false;
  sel.forEach(function(s){ if(s.perUnit){ from=true; return; } var p=priceText(s); var n=priceNum(p); if(n===null){ from=true; return; } sum+=n; if(/od|from|от/i.test(p)) from=true; });
  return {sum:sum, from:from};
}
function selected(){ return Array.prototype.slice.call(document.querySelectorAll("#bservices input:checked")).map(function(i){ return SERVICES.filter(function(s){return s.id===i.value;})[0]; }).filter(Boolean); }
function renderServices(){
  var l=curLang(), box=document.getElementById("bservices");
  var checked={}; Array.prototype.forEach.call(box.querySelectorAll("input:checked"), function(i){ checked[i.value]=1; });
  box.innerHTML="";
  SERVICES.forEach(function(s){
    var lab=document.createElement("label"); lab.className="bcard";
    var cb=document.createElement("input"); cb.type="checkbox"; cb.value=s.id; cb.checked=!!checked[s.id];
    var img=document.createElement("img"); img.className="bthumb"; img.src=s.img; img.alt=""; img.loading="lazy";
    var t=document.createElement("span"); t.className="bcard-t"; t.textContent=s[l];
    var pb=document.createElement("span"); pb.className="bpricebox";
    var p=document.createElement("span"); p.className="bcard-p"; p.textContent=priceText(s);
    var d=document.createElement("span"); d.className="bcard-d"; d.textContent=(s.dur? ((s.durFrom? T().fromShort+" ":"") + s.dur + " min") : "");
    pb.appendChild(p); pb.appendChild(d);
    lab.appendChild(cb); lab.appendChild(img); lab.appendChild(t); lab.appendChild(pb);
    cb.addEventListener("change", function(){ update(); refreshTimes(); });
    box.appendChild(lab);
  });
  update();
}
function update(){
  var sel=selected(), el=document.getElementById("btotal");
  Array.prototype.forEach.call(document.querySelectorAll("#bservices .bcard"), function(c){
    c.classList.toggle("on", !!c.querySelector("input").checked);
  });
  if(!sel.length){ el.classList.remove("on"); el.textContent=""; return; }
  var ti=totalInfo(sel), t=T();
  el.classList.add("on");
  el.textContent = t.total+": " + (ti.from ? t.from+" " : "") + ti.sum + " €";
  var bc=document.getElementById("bcal"); if(bc){ bc.disabled = (sel.length!==1); bc.style.opacity = (sel.length===1? "1":"0.5"); }
}
function buildMessage(){
  var sel=selected(), t=T(), l=curLang();
  if(!sel.length){ alert(t.warn); return; }
  var name=document.getElementById("bname").value.trim();
  var phone=document.getElementById("bphone").value.trim();
  var email=(document.getElementById("bemail")||{}).value ? document.getElementById("bemail").value.trim() : "";
  var note=document.getElementById("bnote").value.trim();
  var d=document.getElementById("bdate").value, tm=document.getElementById("btime").value;
  var ti=totalInfo(sel);
  var msg=t.hi+"\n"+t.sv+":";
  sel.forEach(function(s){ msg+="\n• "+s[l]+" ("+priceText(s)+")"; });
  msg+="\n"+t.total+": "+(ti.from? t.from+" ":"")+ti.sum+" €";
  if(d) msg+="\n"+t.dt+": "+d;
  if(tm) msg+="\n"+t.tm+": "+tm;
  if(name) msg+="\n"+t.nm+": "+name;
  if(phone) msg+="\n"+t.ph+": "+phone;
  if(email) msg+="\nE-mail: "+email;
  if(note) msg+="\n"+t.nt+": "+note;
  return msg;
}
function waSend(msg){
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(msg),"_blank");
}
function showSent(txt){
  var h=document.getElementById("bhint");
  if(h){ h.textContent="\u2705 "+(txt||T().book_sent); h.classList.add("ok"); }
  var f=document.getElementById("booking");
  if(f){ f.classList.add("done"); }
}
function apiSend(msg, cb){
  var name=(document.getElementById("bname")||{}).value||"";
  var phone=(document.getElementById("bphone")||{}).value||"";
  var email=(document.getElementById("bemail")||{}).value||"";
  fetch("https://formsubmit.co/ajax/solopova.makeup@gmail.com",{
    method:"POST",
    headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify({_subject:"Nova rezervacija \u2013 Solopova Makeup",_template:"table",_captcha:"false",_autoresponse:T().book_auto,name:name.trim(),phone:phone.trim(),email:email.trim(),Ime:name.trim(),Telefon:phone.trim(),Sporocilo:msg})
  }).then(function(r){ return r.json(); }).then(function(j){ cb(!!(j&&(j.success===true||j.success==="true"))); }).catch(function(){ cb(false); });
}
function send(){
  var msg=buildMessage(); if(!msg) return;
  var b=document.getElementById("bsend"); if(!b) return;
  var old=b.textContent; b.disabled=true; b.textContent="\u2026";
  apiSend(msg, function(ok){
    b.disabled=false; b.textContent=old;
    if(ok){ showSent(); } else { showSent("Ni potrditve – odpiram WhatsApp / no confirmation – opening WhatsApp"); waSend(msg); }
  });
}
function sendMail(){
  var msg=buildMessage(); if(!msg) return;
  window.open("https://mail.google.com/mail/?view=cm&fs=1&to=solopova.makeup@gmail.com&su="+encodeURIComponent(T().hi)+"&body="+encodeURIComponent(msg),"_blank");
}
var SLOTS=null, SLOT_URL="assets/slots.json";
var BRIDGE="https://solopova-slots.solopoff-mikhail.workers.dev/slots";
var LIVE={}, LIVE_PENDING={};
function hmLocal(iso){ try { return new Date(iso).toLocaleTimeString("sl-SI",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Europe/Ljubljana"}); } catch(e){ return ""; } }
function liveTimes(slug, d){
  if(!slug) return null;
  var key=slug+"|"+d;
  if(LIVE[key]!==undefined) return LIVE[key];
  if(!LIVE_PENDING[key]){
    LIVE_PENDING[key]=1;
    fetch(BRIDGE+"?service="+encodeURIComponent(slug)+"&start="+encodeURIComponent(d+"T00:00:00.000Z")+"&end="+encodeURIComponent(d+"T23:59:59.000Z"))
      .then(function(r){ return r.json(); })
      .then(function(j){
        var jj=(j&&j.result&&j.result.data&&j.result.data.json)||{};
        var items=(jj.slots&&jj.slots[d])||[];
        LIVE[key]=items.map(function(it){ return hmLocal(it.time||""); }).filter(Boolean);
        delete LIVE_PENDING[key];
        refreshTimes();
      })
      .catch(function(){ delete LIVE_PENDING[key]; });
  }
  return null;
}
function winFor(slug){ return (slug==="porocno-licenje")?["05:00","18:00"]:["09:00","18:00"]; }
function bindingService(){ var sel=selected(); if(!sel.length) return null; var best=sel[0]; sel.forEach(function(s){ if((s.dur||0)>(best.dur||0)) best=s; }); return best; }
function refreshTimes(){
  var tm=document.getElementById("btime"); if(!tm) return;
  var d=document.getElementById("bdate").value, s=bindingService(), l=curLang();
  var prev=tm.value; tm.innerHTML="";
  if(!d){ tm.appendChild(new Option((l==="ru"?"— выберите дату —":(l==="en"?"— choose a date —":"— izberite datum —")), "")); return; }
  var win=winFor(s?s.slug:"");
  var noFree=(l==="ru"?"Нет свободного времени":(l==="en"?"No free slots":"Ni prostih terminov"));
  var farText=(l==="ru"?"Дата дальше календаря — отправьте заявку":(l==="en"?"Date is beyond the calendar — send a request":"Datum je izven koledarja — pošljite zahtevek"));
  if(s){
    var live=liveTimes(s.slug, d);
    if(live){
      var ltimes=live.filter(function(x){ return x>=win[0] && x<=win[1]; });
      if(ltimes.length){ ltimes.forEach(function(x){ tm.appendChild(new Option(x,x)); }); if(prev) tm.value=prev; return; }
      tm.appendChild(new Option(noFree, "")); return;
    }
  }
  var svc=(SLOTS && s && SLOTS.slots && SLOTS.slots[s.slug]) ? SLOTS.slots[s.slug] : null;
  var keys=svc?Object.keys(svc):[];
  if(svc){
    if(!keys.length || d>keys[keys.length-1]){ tm.appendChild(new Option(farText, "")); return; }
    var times=(svc[d]||[]).filter(function(x){ return x>=win[0] && x<=win[1]; });
    if(times.length){ times.forEach(function(x){ tm.appendChild(new Option(x,x)); }); if(prev) tm.value=prev; return; }
    tm.appendChild(new Option(noFree, "")); return;
  }
  for(var h=parseInt(win[0],10); h<=parseInt(win[1],10); h++){
    ["00","30"].forEach(function(m){ var hh=(h<10?"0"+h:""+h), x=hh+":"+m; if(x>=win[0] && x<=win[1]) tm.appendChild(new Option(x,x)); });
  }
  if(prev) tm.value=prev;
}
function loadSlots(){ fetch(SLOT_URL+"?t="+Date.now()).then(function(r){ return r.json(); }).then(function(j){ SLOTS=j; refreshTimes(); }).catch(function(){ SLOTS=null; refreshTimes(); }); }
function calUrl(){
  var sel=selected(); if(sel.length!==1) return null;
  var s=sel[0]; if(!s.slug) return null;
  var d=document.getElementById("bdate").value;
  var u="https://cal.com/solopova-makeup/"+s.slug+"?lang="+curLang();
  if(d) u+="&date="+d;
  return u;
}
function calClick(){
  var u=calUrl();
  if(!u){ alert(T().needone); return; }
  window.open(u,"_blank");
}
document.addEventListener("DOMContentLoaded", function(){
  var tm=document.getElementById("btime"); ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00"].forEach(function(o){ var e=document.createElement("option"); e.value=o; e.textContent=o; tm.appendChild(e); });
  document.getElementById("bdate").min=new Date().toISOString().split("T")[0];
  renderServices();
  refreshTimes();
  loadSlots();
  document.getElementById("bdate").addEventListener("change", refreshTimes);
  document.getElementById("bsend").addEventListener("click", send);
  var bm=document.getElementById("bmail"); if(bm) bm.addEventListener("click", sendMail);
  var bc=document.getElementById("bcal"); if(bc) bc.addEventListener("click", calClick);
  document.querySelectorAll(".lang button").forEach(function(b){ b.addEventListener("click", function(){ setTimeout(function(){ renderServices(); refreshTimes(); },0); }); });
});
